name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'master' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Quality Checks & Build
        run: npm run prepublishOnly

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
